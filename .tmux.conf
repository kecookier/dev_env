unbind C-b
set -g prefix C-s
#按两次C-a,可以向其他程序发送 C-a
bind C-s send-prefix

set -sg escape-time 1

#set -g base-index 1
#setw -g pane-base-index 12

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# window和panel相关快捷键
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

#setw -g mode-mouse off
#set -g mouse-select-pane off
#set -g mouse-resize-pane off
#set -g mouse-select-window off

set -g status-left "#[fg=#0d1117,bg=#1f6feb,bold] #S "
#set -g status-right "#[fg=cyan]%d %b %R"
#set -g status-utf8 on
set -g status-interval 60
set -g status-justify centre
setw -g monitor-activity on
set -g visual-activity on

setw -g mode-keys vi
#unbind [
#bind Escape copy-mode
#bind -t vi-copy 'v' begin-selection
#bind -t vi-copy 'y' copy-selection


# -n 指定的快捷键，不需要输入PREFIX
#bind-key -n C-r source-file ~/.tmux.conf
# ===== 2026-10 tmux 3.3a 调优（追加段）=====
# 鼠标：滚动翻页、点选 pane、拖拽调宽
set -g mouse on
# 回滚缓冲区扩到 100k 行
set -g history-limit 100000
# 真彩支持（配合 Ghostty）
set -ga terminal-overrides ",*256col*:Tc"
# vim autoread 感知焦点切换
set -g focus-events on
# OSC52 剪贴板：远程 yank 直接进 Mac 剪贴板
set -g set-clipboard on
# vi 复制模式快捷键
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# 关窗口后自动重排编号
set -g renumber-windows on
# ===== 2026-10 tmux 状态栏（对齐 Ghostty GitHub Dark Default） =====
# 整体
set -g status-style bg=#0d1117,fg=#c9d1d9
# 左侧：session 名
set -g status-left-length 20
set -g status-left "#[fg=#0d1117,bg=#1f6feb,bold] #S "
# 右侧：日期 时间 负载
set -g status-right-length 20
set -g status-right "#[fg=#8b949e] %H:%M "
# 普通窗口标签
setw -g window-status-style fg=#8b949e,bg=#0d1117
setw -g window-status-format " #I:#W "
# 当前窗口标签（GitHub 蓝高亮）
setw -g window-status-current-style fg=#ffffff,bg=#1f6feb,bold
setw -g window-status-current-format " #I:#W "
# 非当前窗口活动提醒
setw -g window-status-activity-style fg=#f85149,bg=#0d1117
# 窗格分隔线（GitHub border 色）
set -g pane-border-style fg=#30363d
set -g pane-active-border-style fg=#58a6ff
# 消息提示
set -g message-style fg=#0d1117,bg=#d29922,bold

# ===== 2026-10 优化段（清理死配置后新增） =====
# 多客户端 attach 时按当前活跃客户端尺寸渲染
set -g aggressive-resize on
# 窗口列表左对齐（tab 多时不挤两侧）
set -g status-justify left
# 后台窗口有输出只变红标签，不弹消息
set -g visual-activity off
# C-s S 开关多 pane 同步输入
bind S setw synchronize-panes
